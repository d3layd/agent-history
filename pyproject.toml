[project]
name = "agent-history"
version = "0.4.3"
description = "Local semantic search over AI coding agent session transcripts, using Ollama embeddings and sqlite-vec"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Dennis Layden", email = "github@dennislayden.com" }]
keywords = ["claude-code", "semantic-search", "ollama", "sqlite-vec", "transcripts"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "sqlite-vec>=0.1.6",
    "requests>=2.32",
]

[project.urls]
Homepage = "https://github.com/d3layd/agent-history"
Issues = "https://github.com/d3layd/agent-history/issues"

[project.scripts]
agent-history = "agent_history.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_history"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
